[project]
name = "zhrag"
version = "0.1.0"
description = "Enterprise Chinese RAG with a reproducible CRUD-RAG evaluation harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx>=0.28.1",
]

milvus = [
    "pymilvus==3.0.1",
]

verify = [
    "bert-score==0.3.13",
    "jieba>=0.42.1",
    "rouge-chinese>=1.0.3",
    "sacrebleu>=2.5",
]

service = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhrag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"
extend-exclude = [
    ".venv-research",
    ".research_tmp",
    "_research_*.py",
    "crud-rag-subset",
    "tidb-rag-curated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
# PLW1514 (open() without explicit encoding) is the rule that matters most here:
# this machine's Python defaults to cp936, so a bare open() cannot read our own
# Chinese corpora. Every file access must go through zhrag.io_utils.
#
# RUF001/002/003 flag full-width CJK punctuation (，。！) as "ambiguous unicode".
# That rule assumes an English codebase; here the full-width forms are correct
# and the ASCII ones would be wrong, so it is disabled rather than suppressed
# line by line.
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/zhrag/io_utils.py" = ["PLW1514"]  # the one place allowed to call open() directly

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp is pinned inside the project because the default under
# %LOCALAPPDATA%\Temp is not writable on this Windows install (WinError 5).
addopts = "-q --strict-markers --basetemp=.pytest_tmp"

[tool.mypy]
python_version = "3.13"
packages = ["zhrag"]
strict = true

[[tool.mypy.overrides]]
# jieba ships no type stubs and has had no release since 0.42.1 (2020). It is an
# optional extra used only for the lexical-analyzer ablation row, so an untyped
# import here does not weaken the checked surface.
module = ["jieba"]
ignore_missing_imports = true
